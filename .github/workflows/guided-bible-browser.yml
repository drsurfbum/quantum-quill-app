name: Guided Story Bible browser verification
on:
  push:
    branches: [codex/workspace-integration]
    paths:
      - 'client/**'
      - 'shared/**'
      - 'tests/**'
      - '.github/workflows/guided-bible-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install disposable browser-test tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/browser-guided-bible.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-story-bible-synthetic-browser
          path: artifacts/qq14/
          retention-days: 14
