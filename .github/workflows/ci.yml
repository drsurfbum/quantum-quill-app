name: Stabilization checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qq_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qq_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm prune --omit=dev --ignore-scripts
      - run: npm run test:alpha
        env:
          QQ_TEST_PG_ADMIN_URL: postgresql://qq_test:synthetic-ci-password@127.0.0.1:5432/postgres
          PG_BIN: /usr/lib/postgresql/16/bin
