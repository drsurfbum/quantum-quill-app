name: Writing history browser verification
on:
  pull_request:
    paths: ['client/**', 'server/**', 'shared/**', 'tests/**', '.github/workflows/prose-history-browser.yml']
  push:
    branches: [codex/writing-version-history, codex/writing-first-layout]
    paths: ['client/**', 'server/**', 'shared/**', 'tests/**', '.github/workflows/prose-history-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    # Keep the image and npm package at the same Playwright version. The official
    # image supplies browsers and OS dependencies without a per-run apt download.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install disposable browser-test tooling
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.1
      - run: node tests/browser-prose-history.mjs
      - run: node tests/browser-history-word-finder.mjs
      - run: node tests/browser-history-word-finder.mjs
        env:
          QQ_BROWSER_ENGINE: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writing-history-synthetic-browser
          path: artifacts/history/
          retention-days: 14
